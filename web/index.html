document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rmat('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"94cdb36f-8f86-4111-a346-0d06ade69213\"><\u002Fscript>\n<style>\nbody{margin:0;background:#f4f6fc;color:#1c2033;font-family:'IBM Plex Sans Thai',Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#4f6bf6;text-decoration:none}a:hover{color:#3a54d6}\n*{box-sizing:border-box}\n::selection{background:#dbe2ff}\n@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}\n@keyframes flash{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}\n@keyframes alarmPulse{0%,100%{background:#fee2e2;color:#991b1b}50%{background:#fecaca;color:#7f1d1d}}\n@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}100%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}\n@keyframes draw{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}\n@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ needLogin }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 10% 0%,#eaf0ff 0%,#f4f6fc 45%,#fdf2f8 100%)\">\n  <div style=\"width:100%;max-width:440px;background:#fff;border-radius:24px;padding:34px;box-shadow:0 24px 60px rgba(28,32,51,.10),0 2px 6px rgba(28,32,51,.05);animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n      <div style=\"width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,#4f6bf6,#8b5cf6);displa  style-hover=\"transform:translateY(-1px);box-shadow:0 16px 30px rgba(79,107,246,.4)\">{{ loginLabel }}<\u002Fbutton>\n      <div style=\"min-height:20px;font:400 13px/1.5 'IBM Plex Sans Thai',sans-serif;color:#ef4444\">{{ err }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ tvMode }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height:100vh;background:#0f1226;color:#fff;padding:clamp(20px,3vw,44px);display:grid;grid-template-rows:auto 1fr auto;gap:clamp(16px,2.4vh,32px)\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n    <div style=\"font:700 clamp(20px,2.2vw,32px)/1 'IBM Plex Sans Thai',sans-serif\">สถานะสายผลิต · Color Inspection<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <div style=\"width:14px;height:14px;border-radius:50%;background:{{ connDot }};animation:dotPulse 1.6s ease-out infinite\"><\u002Fdiv>\n      <div style=\"font:500 14px/1 'IBM Plex Sans Thai',sans-serif;color:#b9bedb\">{{ connText }}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ exitTv }}\" style=\"height:44px;padding:0 18px;border:1.5px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;font:600 13px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.16)\">ออกจาก TV<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px)\">\n    <sc-for list=\"{{ tvTiles }}\" as=\"t\" hint-placeholder-count=\"3\">\n      <div style=\"border-radius:24px;padding:clamp(18px,2.2vw,34px);background:{{ t.bg }};box-shadow:0 18px 40px rgba(0,0,0,.28)\">\n        <div style=\"font:600 14px/1 'IBM Plex Sans Thai',sans-serif;color:{{ t.labelFg }};letter-spacing:.06em\">{{ t.label }}<\u002Fdiv>\n        <div style=\"font:800 clamp(52px,8vw,132px)/1 Archivo,sans-serif;letter-spacing:-.03em;font-variant-num   <text x=\"110\" y=\"120\" text-anchor=\"middle\" font-family=\"IBM Plex Sans Thai\" font-size=\"12\" fill=\"#6c7286\">{{ countingSetting }}<\u002Ftext>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:9px;margin-top:8px;font:500 13px/1.4 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">\n              <div style=\"display:flex;justify-content:space-between\"><span>อัตราผลิต<\u002Fspan><span style=\"color:#1c2033;font-weight:600\">{{ rateTxt }} ชิ้น/นาที<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between\"><span>คาดว่าจะครบใน<\u002Fspan><span style=\"color:#1c2033;font-weight:600\">{{ etaTxt }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between\"><span>Downtime วันนี้<\u002Fspan><span style=\"color:#1c2033;font-weight:600\">{{ downTxt }} นาที<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:600 12.5px/1.4 'IBM Plex Sans Thai',sans-serif;color:#22b07d;min-height:18px;margin-top:8px\">{{ fullBadge }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-top:14px\">\n          <div style=\"background:#fff;border:1px solid #eceff8;border-radius:20px;padding:20px;box-shadow:0 6px 18px rgba(28,32,51,.05)\">\n            <div style=\"font:600 15px/1.3 'IBM Plex Sans Thai',sans-serif;margin-bottom:14px\">สถานะ I/O<\u002Fdiv>\n            <div style=\"display:grid;gap:8px\">\n              <sc-for list=\"{{ ios }}\" as=\"io\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-radius:14px;background:{{ io.rowBg }}\">\n                  <div style=\"width:11px;height:11px;border-radius:50%;background:{{ io.dot }};animation:{{ io.anim }}\"><\u002Fdiv>\n                  <div style=\"flex:1;font:500 13.5px/1.3 'IBM Plex Sans Thai',sans-serif\">{{ io.name }}<\u002Fdiv>\n                  <div style=\"padding:6px 11px;border-radius:999px;background:{{ io.chipBg }};color:{{ io.chipFg }};font:600 11.5px/1 'IBM Plex Sans Thai',sans-serif\">{{ io.val }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #eceff8;margin-top:16px;padding-top:14px\">\n              <div style=\"font:500 12.5px/1 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">LOCK ต่อเนื่องขณะนี้<\u002Fdiv>\n              <div style=\"font:700 34px/1.1 Archivo,sans-serif;color:{{ lockColor }};margin-top:6px;font-variant-numeric:tabular-nums\">{{ lockSecs }}<span style=\"font:500 14px/1 Archivo,sans-serif;color:#6c7286\"> วินาที<\u002Fspan><\u002Fdiv>\n              <div style=\"font:400 12.5px/1.5 'IBM Plex Sans Thai',sans-serif;color:#7b8194;margin-top:6px\">{{ lastNgText }}<\u002Fdiv>\n              <label style=\"display:flex;align-items:center;gap:10px;min-height:44px;font:500 13px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer;color:#4a4f68\">\n                <input type=\"checkbox\" checked=\"{{ sound }}\" sc-camel-on-change=\"{{ toggleSound }}\" style=\"width:19px;height:19px;accent-color:#4f6bf6\">เสียงเตือนเมื่อเกิด LOCK\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #eceff8;border-radius:20px;padding:20px;box-shadow:0 6px 18px rgba(28,32,51,.05)\">\n            <div style=\"font:600 15px/1.3 'IBM Plex Sans Thai',sans-serif\">Yield Trend<\u002Fdiv>\n            <div style=\"font:400 12px/1.4 'IBM Plex Sans Thai',sans-serif;color:#6c7286;margin-bottom:12px\">เปอร์เซ็นต์ OK รายชั่วโมง<\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 600 190\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:200px;display:block\">\n              <defs>\n                <linearGradient id=\"tl\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n                  <stop offset=\"0%\" stop-color=\"#22b07d\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#4f6bf6\"><\u002Fstop>\n                <\u002FlinearGradient>\n              <\u002Fdefs>\n              <line x1=\"0\" y1=\"20\" x2=\"600\" y2=\"20\" stroke=\"#eef1fb\" stroke-width=\"2\"><\u002Fline>\n              <line x1=\"0\" y1=\"104\" x2=\"600\" y2=\"104\" stroke=\"#eef1fb\" stroke-width=\"2\"><\u002Fline>\n              <line x1=\"0\" y1=\"186\" x2=\"600\" y2=\"186\" stroke=\"#e4e8f6\" stroke-width=\"2\"><\u002Fline>\n              <polyline points=\"{{ trendPoints }}\" fill=\"none\" stroke=\"url(#tl)\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\" stroke-dasharray=\"1600\" style=\"animation:draw 1.5s cubic-bezier(.3,.7,.2,1) both\"><\u002Fpolyline>\n            <\u002Fsvg>\n            <div style=\"display:flex;justify-content:space-between;font:500 11.5px/1 Archivo,sans-serif;color:#6c7286;margin-top:8px\">\n              <span>{{ trendFirst }}<\u002Fspan><span>100 · 50 · 0 %<\u002Fspan><span>{{ trendLast }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #eceff8;margin-top:16px;padding-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n              <input type=\"password\" value=\"{{ pin }}\" sc-camel-on-input=\"{{ onPin }}\" placeholder=\"PIN\" style=\"width:92px;height:46px;padding:0 13px;border:1.5px solid #e4e7f2;border-radius:13px;background:#fafbff;font:500 14px/1 Archivo,sans-serif\" style-focus=\"border-color:#4f6bf6;box-shadow:0 0 0 4px rgba(79,107,246,.14);outline:none\">\n              <input type=\"number\" value=\"{{ settingInput }}\" sc-camel-on-input=\"{{ onSetting }}\" placeholder=\"ตั้งค่า pcs\" style=\"width:126px;height:46px;padding:0 13px;border:1.5px solid #e4e7f2;border-radius:13px;background:#fafbff;font:400 14px/1 'IBM Plex Sans Thai',sans-serif\" style-focus=\"border-color:#4f6bf6;box-shadow:0 0 0 4px rgba(79,107,246,.14);outline:none\">\n              <button sc-camel-on-click=\"{{ sendSetting }}\" style=\"min-height:46px;padding:0 16px;border:none;border-radius:13px;background:#4f6bf6;color:#fff;font:600 13px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer\" style-hover=\"background:#3a54d6\">ตั้งค่า<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ resetNg }}\" style=\"min-height:46px;padding:0 16px;border:none;border-radius:13px;background:#fee2e2;color:#b91c1c;font:600 13px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer\" style-hover=\"background:#fecaca\">เคลียร์ NG/LOCK<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ resetCount }}\" style=\"min-height:46px;padding:0 16px;border:none;border-radius:13px;background:#fef3c7;color:#92400e;font:600 13px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer\" style-hover=\"background:#fde68a\">เคลียร์ Counting<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ resetTotal }}\" style=\"min-height:46px;padding:0 16px;border:none;border-radius:13px;background:#ede9fe;color:#5b21b6;font:600 13px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer\" style-hover=\"background:#ddd6fe\">ล้างยอดรวมสะสม<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ factoryReset }}\" style=\"min-height:46px;padding:0 16px;border:1.5px solid #b91c1c;border-radius:13px;background:#b91c1c;color:#fff;font:600 13px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer\" style-hover=\"background:#991b1b\">คืนค่าทั้งหมด<\u002Fbutton>\n              <div style=\"font:500 12.5px/1.4 'IBM Plex Sans Thai',sans-serif;color:#4f6bf6;min-height:18px;flex:1;min-width:140px\">{{ cmdMsg }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isFeed }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:viewIn .32s ease both\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px\">\n          <div>\n            <h2 style=\"font:700 clamp(22px,2.6vw,30px)/1.2 'IBM Plex Sans Thai',sans-serif;margin:0\">บันทึกผลการเทส<\u002Fh2>\n            <div style=\"font:400 13.5px/1.5 'IBM Plex Sans Thai',sans-serif;color:#7b8194;margin-top:6px\">ทุกชิ้นที่เครื่องตรวจเข้ามาที่นี่อัตโนมัติ — NG ระบุว่าสี ID ใดหายไป<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px\">\n            <div style=\"background:#fff;border:1px solid #eceff8;border-radius:18px;padding:14px 20px;box-shadow:0 6px 18px rgba(28,32,51,.05)\">\n              <div style=\"font:500 11.5px/1 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">OK ในกะ<\u002Fdiv>\n              <div style=\"font:700 27px/1.15 Archivo,sans-serif;color:#22b07d;font-variant-numeric:tabular-nums\">{{ feedOk }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #eceff8;border-radius:18px;padding:14px 20px;box-shadow:0 6px 18px rgba(28,32,51,.05)\">\n              <div style=\"font:500 11.5px/1 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">NG ในกะ<\u002Fdiv>\n              <div style=\"font:700 27px/1.15 Archivo,sans-serif;color:#ef4444;font-variant-numeric:tabular-nums\">{{ feedNg }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"height:5px;border-radius:999px;background:#e8ecfa;overflow:hidden;margin-bottom:12px\">{{ feedFlash }}<\u002Fdiv>\n\n        <div style=\"display:grid;gap:10px\">\n          <sc-for list=\"{{ feed }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:46px 84px 1fr auto;gap:14px;align-items:center;min-height:78px;padding:12px 18px;background:{{ r.bg }};border:1px solid {{ r.border }};border-radius:18px;box-shadow:0 4px 14px rgba(28,32,51,.04);transition:background .6s ease,transform .18s ease\" style-hover=\"transform:translateY(-2px)\">\n              <div style=\"width:40px;height:40px;border-radius:13px;background:{{ r.iconBg }};color:{{ r.iconFg }};display:grid;place-items:center;font:700 15px/1 Archivo,sans-serif\">{{ r.icon }}<\u002Fdiv>\n              <div style=\"font:600 12.5px/1 Archivo,sans-serif;color:#6c7286;font-variant-numeric:tabular-nums\">{{ r.time }}<\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font:600 15px/1.35 'IBM Plex Sans Thai',sans-serif;color:{{ r.color }}\">{{ r.title }}<\u002Fdiv>\n                <div style=\"font:400 12.5px/1.4 'IBM Plex Sans Thai',sans-serif;color:#7b8194\">{{ r.detail }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px\">\n                <sc-if value=\"{{ r.isNg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;gap:6px\">\n                    <sc-for list=\"{{ r.chips }}\" as=\"c\" hint-placeholder-count=\"2\">\n                      <div style=\"height:32px;padding:0 12px;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};font:600 12px/32px 'IBM Plex Sans Thai',sans-serif\">{{ c.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"height:32px;padding:0 14px;border-radius:999px;background:{{ r.stampBg }};color:{{ r.stampFg }};font:700 12px/32px Archivo,sans-serif;letter-spacing:.06em\">{{ r.stamp }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ feedEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px dashed #d9dff2;border-radius:20px;padding:60px 20px;text-align:center;font:400 14px/1.6 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">ยังไม่มีผลการเทสเข้ามา — รอสัญญาณจากเครื่อง<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:viewIn .32s ease both\">\n        <h2 style=\"font:700 clamp(22px,2.6vw,30px)/1.2 'IBM Plex Sans Thai',sans-serif;margin:0 0 6px\">ประวัติผลการเทส<\u002Fh2>\n        <div style=\"font:400 13.5px/1.5 'IBM Plex Sans Thai',sans-serif;color:#7b8194;margin-bottom:16px\">พบ {{ histCount }} รายการ · หน้า {{ pageNo }} / {{ pageTotal }} · ใช้ช่องค้นหาด้านบนได้<\u002Fdiv>\n\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px\">\n          <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ f.go }}\" style=\"min-height:42px;padding:0 16px;border:1.5px solid {{ f.border }};border-radius:999px;background:{{ f.bg }};color:{{ f.fg }};font:600 12.5px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer;transition:background .16s ease\" style-hover=\"border-color:#4f6bf6\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #eceff8;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(28,32,51,.05)\">\n          <div style=\"display:grid;grid-template-columns:70px 150px 1fr 145px 165px 82px;gap:12px;padding:14px 18px;background:#f8f9fe;font:600 11.5px/1 'IBM Plex Sans Thai',sans-serif;color:#5a6076\">\n            <div>ลำดับ<\u002Fdiv><div>เวลา<\u002Fdiv><div>สาเหตุ<\u002Fdiv><div>สีที่หาย<\u002Fdiv><div>Event<\u002Fdiv><div>ผล<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ histRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <div style=\"display:grid;grid-template-columns:70px 150px 1fr 145px 165px 82px;gap:12px;align-items:center;min-height:54px;padding:8px 18px;border-top:1px solid #f1f3fb;font:400 13px/1.4 'IBM Plex Sans Thai',sans-serif;transition:background .15s ease\" style-hover=\"background:#f8f9fe\">\n              <div style=\"font:700 12.5px/1 Archivo,sans-serif;color:#4a4f68;font-variant-numeric:tabular-nums\">#{{ r.seq }}<\u002Fdiv>\n              <div style=\"font-variant-numeric:tabular-nums\">{{ r.time }}<\u002Fdiv>\n              <div style=\"color:#4a4f68\">{{ r.cause }}<\u002Fdiv>\n              <div style=\"color:{{ r.missColor }};font-weight:600\">{{ r.missing }}<\u002Fdiv>\n              <div style=\"font:600 12px/1.3 Archivo,sans-serif;color:#8b90a3\">{{ r.event }}<\u002Fdiv>\n              <div style=\"height:28px;padding:0 12px;border-radius:999px;background:{{ r.stampBg }};color:{{ r.stampFg }};font:700 11px/28px Archivo,sans-serif;justify-self:start\">{{ r.stamp }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ histEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:52px 18px;text-align:center;font:400 14px/1.6 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">ไม่พบรายการที่ตรงกับเงื่อนไข<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:16px\">\n          <button sc-camel-on-click=\"{{ prevPage }}\" style=\"min-height:46px;padding:0 18px;border:1.5px solid #e4e7f2;border-radius:13px;background:#fff;font:600 13px/1 'IBM Plex Sans Thai',sans-serif;color:#4a4f68;cursor:pointer\" style-hover=\"background:#f6f7fd\">← ก่อนหน้า<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ nextPage }}\" style=\"min-height:46px;padding:0 18px;border:1.5px solid #e4e7f2;border-radius:13px;background:#fff;font:600 13px/1 'IBM Plex Sans Thai',sans-serif;color:#4a4f68;cursor:pointer\" style-hover=\"background:#f6f7fd\">ถัดไป →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isLot }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:viewIn .32s ease both\">\n        <h2 style=\"font:700 clamp(22px,2.6vw,30px)/1.2 'IBM Plex Sans Thai',sans-serif;margin:0 0 16px\">ล็อตที่กำลังเดินอยู่<\u002Fh2>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px\">\n          <sc-for list=\"{{ lotTiles }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:1px solid #eceff8;border-radius:20px;padding:18px;box-shadow:0 6px 18px rgba(28,32,51,.05);animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">\n                <div style=\"width:36px;height:36px;border-radius:12px;background:{{ s.iconBg }};color:{{ s.iconFg }};display:grid;place-items:center;font:700 14px/1 Archivo,sans-serif\">{{ s.icon }}<\u002Fdiv>\n                <div style=\"font:500 12.5px/1.3 'IBM Plex Sans Thai',sans-serif;color:#7b8194\">{{ s.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:700 30px/1.15 Archivo,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em\">{{ s.value }}<\u002Fdiv>\n              <div style=\"font:400 11.5px/1.4 'IBM Plex Sans Thai',sans-serif;color:#6c7286;margin-top:4px\">{{ s.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px\">\n          <div style=\"background:#fff;border:1px solid #eceff8;border-radius:20px;padding:20px;box-shadow:0 6px 18px rgba(28,32,51,.05)\">\n            <div style=\"font:600 15px/1.3 'IBM Plex Sans Thai',sans-serif;margin-bottom:16px\">สาเหตุ NG · แยกตามสีที่หายไป<\u002Fdiv>\n            <div style=\"display:grid;gap:14px\">\n              <sc-for list=\"{{ ngBreak }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"display:flex;justify-content:space-between;font:500 13px/1.3 'IBM Plex Sans Thai',sans-serif;margin-bottom:7px\">\n                    <span>{{ b.label }}<\u002Fspan><span style=\"color:#6c7286;font-variant-numeric:tabular-nums\">{{ b.count }} ครั้ง · {{ b.pct }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:14px;border-radius:999px;background:#f1f3fb;overflow:hidden\">\n                    <div style=\"height:100%;border-radius:999px;background:{{ b.color }};width:{{ b.w }};transition:width .7s cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ ngBreakEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font:400 13.5px/1.6 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">ยังไม่มี NG ในช่วง 12 ชั่วโมงนี้<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:linear-gradient(150deg,#eef2ff,#fdf2f8);border:1px solid #e7ebfb;border-radius:20px;padding:20px\">\n            <div style=\"font:600 15px/1.3 'IBM Plex Sans Thai',sans-serif;margin-bottom:10px\">ความก้าวหน้า<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:12px\">\n              <div style=\"font:700 clamp(38px,4.4vw,56px)/1.05 Archivo,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums\">{{ pctTxt }}<\u002Fdiv>\n              <div style=\"font:500 13.5px/1.4 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">{{ countingSetting }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:22px;border-radius:999px;background:rgba(255,255,255,.75);margin-top:18px;overflow:hidden\">\n              <div style=\"height:100%;border-radius:999px;background:linear-gradient(90deg,#4f6bf6,#8b5cf6);width:{{ pctStr }};transition:width .7s cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:9px;margin-top:20px;font:500 13px/1.4 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">\n              <div style=\"display:flex;justify-content:space-between\"><span>อัตราผลิต<\u002Fspan><span style=\"color:#1c2033;font-weight:600\">{{ rateTxt }} ชิ้น/นาที<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between\"><span>คาดว่าจะครบใน<\u002Fspan><span style=\"color:#1c2033;font-weight:600\">{{ etaTxt }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between\"><span>Downtime วันนี้<\u002Fspan><span style=\"color:#1c2033;font-weight:600\">{{ downTxt }} นาที<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isReport }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:viewIn .32s ease both\">\n        <h2 style=\"font:700 clamp(22px,2.6vw,30px)/1.2 'IBM Plex Sans Thai',sans-serif;margin:0 0 6px\">รายงานสรุป<\u002Fh2>\n        <div style=\"font:400 13.5px/1.5 'IBM Plex Sans Thai',sans-serif;color:#7b8194;margin-bottom:16px\">สรุปรายชั่วโมงจาก event_log ย้อนหลัง 12 ชั่วโมง<\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #eceff8;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(28,32,51,.05)\">\n          <div style=\"display:grid;grid-template-columns:110px 1fr 1fr 1.5fr;gap:12px;padding:14px 18px;background:#f8f9fe;font:600 11.5px/1 'IBM Plex Sans Thai',sans-serif;color:#5a6076\">\n            <div>ชั่วโมง<\u002Fdiv><div>OK<\u002Fdiv><div>NG<\u002Fdiv><div>Yield<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ reportRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n            <div style=\"display:grid;grid-template-columns:110px 1fr 1fr 1.5fr;gap:12px;align-items:center;min-height:50px;padding:6px 18px;border-top:1px solid #f1f3fb;font:500 13px/1.3 'IBM Plex Sans Thai',sans-serif;font-variant-numeric:tabular-nums\" style-hover=\"background:#f8f9fe\">\n              <div style=\"font:600 13px/1 Archivo,sans-serif\">{{ r.hour }}<\u002Fdiv>\n              <div style=\"color:#22b07d;font-weight:600\">{{ r.ok }}<\u002Fdiv>\n              <div style=\"color:{{ r.ngColor }};font-weight:600\">{{ r.ng }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:56px\">{{ r.yield }}<\u002Fspan><span style=\"flex:1;max-width:220px;height:10px;border-radius:999px;background:#f1f3fb;overflow:hidden\"><span style=\"display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4f6bf6,#8b5cf6);width:{{ r.w }}\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:18px\">\n          <button sc-camel-on-click=\"{{ exportCsv }}\" style=\"min-height:50px;padding:0 20px;border:none;border-radius:14px;background:linear-gradient(135deg,#4f6bf6,#6d5cf6);color:#fff;font:600 13.5px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer;box-shadow:0 12px 24px rgba(79,107,246,.28)\" style-hover=\"transform:translateY(-1px)\">⬇ Export CSV (2,000 รายการล่าสุด)<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ reload }}\" style=\"min-height:50px;padding:0 20px;border:1.5px solid #e4e7f2;border-radius:14px;background:#fff;color:#4a4f68;font:600 13.5px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer\" style-hover=\"background:#f6f7fd\">รีเฟรชข้อมูล<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top:36px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:400 11.5px/1.4 'IBM Plex Sans Thai',sans-serif;color:#6c7286\">\n        <span>Color Inspection System · Supabase Realtime<\u002Fspan><span>{{ userLabel }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ confirmOn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ confirmCancel }}\" style=\"position:fixed;inset:0;z-index:200;background:rgba(20,24,40,.46);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;animation:viewIn .18s ease both\">\n    <div style=\"width:min(460px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(28,32,51,.28);animation:cardIn .28s cubic-bezier(.2,.8,.2,1) both\">\n      <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:16px\">\n        <div style=\"width:44px;height:44px;border-radius:14px;background:#fee2e2;color:#b91c1c;display:grid;place-items:center;font:700 20px/1 Archivo,sans-serif;flex:none\">!<\u002Fdiv>\n        <div style=\"font:700 18px/1.35 'IBM Plex Sans Thai',sans-serif;color:#1c2033\">{{ confirmTitle }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:9px;margin-bottom:22px\">\n        <sc-for list=\"{{ confirmLines }}\" as=\"ln\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:10px;align-items:flex-start;font:400 14px/1.55 'IBM Plex Sans Thai',sans-serif;color:#4a5064\">\n            <span style=\"color:#4f6bf6;font-weight:700;line-height:1.55\">•<\u002Fspan><span>{{ ln.text }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:11px;justify-content:flex-end\">\n        <button sc-camel-on-click=\"{{ confirmCancel }}\" style=\"min-height:46px;padding:0 20px;border:1.5px solid #e4e7f2;border-radius:13px;background:#fff;color:#4a5064;font:600 13.5px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer\" style-hover=\"background:#f6f7fc;border-color:#cfd5ee\">ยกเลิก<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ confirmAccept }}\" style=\"min-height:46px;padding:0 20px;border:none;border-radius:13px;background:#b91c1c;color:#fff;font:600 13.5px/1 'IBM Plex Sans Thai',sans-serif;cursor:pointer\" style-hover=\"background:#991b1b\">{{ confirmOkLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showSparklines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;}}\">\nconst SUPABASE_URL = 'https://ufmwcstlzygrnmzkpgbs.supabase.co';\nconst SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmbXdjc3Rsenlncm5temtwZ2JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzgxOTgsImV4cCI6MjEwMzM1NDE5OH0.geNcAdB1YL2N9XozB49uyu-__N5KyRg4gKuj0ftOD1g';\nconst BLUE = '#4f6bf6', GREEN = '#22b07d', PURPLE = '#8b5cf6', AMBER = '#f59e0b', RED = '#ef4444', PINK = '#ec4899';\nconst INK = '#1c2033', MUTE = '#6c7286';\n\nclass Component extends DCLogic {\n  state = {\n    ready: false, authed: false, email: '', pw: '', err: '', busy: false,\n    view: 'live', tv: false, status: null, events: [], historyEvents: [], lastConn: 0, lockStart: null,\n    lockSecs: 0, downSecs: 0, sound: true, pin: '', settingInput: '', cmdMsg: '',\n    q: '', filter: 'all', page: 0, flashKey: 0, newIds: [], userEmail: '',\n    confirmOn: false, confirmTitle: '', confirmLines: [], confirmOkLabel: '',\n    disp: { ok: 0, ng: 0, yld: 0, rate: 0, down: 0, counting: 0 },\n  };\n  targets = { ok: 0, ng: 0, yld: 0, rate: 0, down: 0, counting: 0 };\n  okHist = []; ngHist = []; yHist = []; rHist = []; dHist = [];\n\n  componentDidMount() {\n    this.waitSb();\n    this.timer = setInterval(() => this.tick(), 1000);\n    this.anim = requestAnimationFrame(() => this.animLoop());\n  }\n  componentWillUnmount() { clearInterval(this.timer); clearInterval(this.poll); cancelAnimationFrame(this.anim); }\n\n  waitSb() {\n    if (window.supabase && window.supabase.createClient) {\n      this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);\n      this.sb.auth.getSession().then(({ data }) => {\n        this.setState({ ready: true });\n        if (data && data.session) this.start(data.session.user && data.session.user.email);\n      });\n    } else setTimeout(() => this.waitSb(), 150);\n  }\n\n  async doLogin() {\n    if (!this.sb || this.state.busy) return;\n    this.setState({ busy: true, err: '' });\n    const { data, error } = await this.sb.auth.signInWithPassword({ email: this.state.email, password: this.state.pw });\n    if (error) { this.setState({ busy: false, err: 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message }); return; }\n    this.setState({ busy: false });\n    this.start(data && data.user && data.user.email);\n  }\n\n  async start(email) {\n    this.setState({ authed: true, userEmail: email || '' });\n    await this.loadStatus();\n    await this.loadEvents();\n    await this.loadHistory();\n    this.subscribe();\n    this.poll = setInterval(() => { this.loadStatus(); this.loadEvents(); this.loadHistory(); }, 60000);\n  }\n\n  async loadStatus() {\n    const { data, error } = await this.sb.from('status').select('*').eq('id', 1).single();\n    if (!error && data) this.applyStatus(data);\n  }\n  // ใช้ทำแดชบอร์ดสด / รายงานรายชั่วโมง / สรุปล็อต ซึ่งตั้งใจดูย้อนหลังแค่ 12 ชั่วโมง\n  async loadEvents() {\n    const since = new Date(Date.now() - 12 * 3600 * 1000).toISOString();\n    const { data, error } = await this.sb.from('event_log').select('*').gte('created_at', since).order('created_at', { ascending: false }).limit(1000);\n    if (!error && data) this.setState({ events: data });\n  }\n  // ใช้ทำหน้า \"ประวัติ\" กับ Export — ต้องเห็นย้อนหลังได้ไม่จำกัดแค่ 12 ชั่วโมง\n  // ไม่งั้นชิ้นงานที่เทสไปนานกว่านั้นจะหายไปจากหน้าประวัติทั้งที่ยังอยู่ใน Supabase\n  async loadHistory() {\n    const { data, error } = await this.sb.from('event_log').select('*').order('created_at', { ascending: false }).limit(5000);\n    if (!error && data) this.setState({ historyEvents: data });\n  }\n\n  subscribe() {\n    this.sb.channel('status-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'status' }, (p) => this.applyStatus(p.new)).subscribe();\n    this.sb.channel('log-changes').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'event_log' }, (p) => {\n      this.setState((s) => ({\n        events: [p.new].concat(s.events).slice(0, 1000),\n        historyEvents: [p.new].concat(s.historyEvents).slice(0, 5000),\n        flashKey: s.flashKey + 1,\n        newIds: [p.new.id].concat(s.newIds).slice(0, 3),\n      }));\n      if (this.parseEv(p.new.event).ng) this.alarm();\n    }).subscribe();\n  }\n\n  applyStatus(d) {\n    if (!d) return;\n    const total = Number(d.ok_total || 0) + Number(d.ng_total || 0);\n    this.targets = {\n      ok: Number(d.ok_total || 0), ng: Number(d.ng_total || 0),\n      yld: total > 0 ? (Number(d.ok_total) / total) * 100 : 0,\n      rate: Number(d.rate || 0), down: this.state.downSecs / 60, counting: Number(d.counting || 0),\n    };\n    this.push(this.okHist, this.targets.ok); this.push(this.ngHist, this.targets.ng);\n    this.push(this.yHist, this.targets.yld); this.push(this.rHist, this.targets.rate);\n    this.push(this.dHist, this.targets.down);\n    const locked = d.d12 === true;\n    const wasLocked = this.state.lockStart !== null;\n    if (locked && !wasLocked) this.alarm();\n    this.setState({ status: d, lastConn: Date.now(), lockStart: locked ? (this.state.lockStart || Date.now()) : null, lockSecs: locked ? this.state.lockSecs : 0 });\n  }\n  push(arr, v) { arr.push(v); if (arr.length > 24) arr.shift(); }\n\n  tick() {\n    const st = this.state;\n    if (st.lockStart) {\n      const secs = Math.floor((Date.now() - st.lockStart) / 1000);\n      const down = st.downSecs + 1;\n      this.targets.down = down / 60;\n      this.setState({ lockSecs: secs, downSecs: down });\n      if (st.sound && secs > 0 && secs % 5 === 0) this.beep(880, 0.12);\n    }\n    this.forceUpdate();\n  }\n\n  animLoop() {\n    const d = Object.assign({}, this.state.disp); let ch = false;\n    for (const k in this.targets) {\n      const cur = d[k] || 0, dif = this.targets[k] - cur;\n      if (Math.abs(dif) > 0.02) { d[k] = cur + dif * 0.16; ch = true; }\n      else if (cur !== this.targets[k]) { d[k] = this.targets[k]; ch = true; }\n    }\n    if (ch) this.setState({ disp: d });\n    this.anim = requestAnimationFrame(() => this.animLoop());\n  }\n\n  beep(f, dur) {\n    try {\n      if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)();\n      const o = this.ac.createOscillator(), g = this.ac.createGain();\n      o.connect(g); g.connect(this.ac.destination);\n      o.frequency.value = f; o.type = 'square'; g.gain.value = 0.08;\n      o.start(); o.stop(this.ac.currentTime + dur);\n    } catch (e) {}\n  }\n  alarm() { if (this.state.sound) { this.beep(880, 0.18); setTimeout(() => this.beep(620, 0.18), 220); } }\n\n  // ชื่อ event ที่ Nano ส่งมา เช่น ok / ng_miss1 / ng_miss1_2 / auto_fail_miss2\n  // เลขที่ติดมาท้ายชื่อคือ ID ของสีที่ตรวจไม่พบ (คั่นกันไว้ทีละตัว)\n  parseEv(ev) {\n    const s = String(ev || '').toLowerCase();\n    const ng = /ng|fail|lock|miss/.test(s);\n    const m = s.match(/(\\d+)/g);\n    const ids = ng && m ? m.filter((n) => Number(n) >= 1 && Number(n) <= 4) : [];\n    return { ng: ng, ok: !ng && s.indexOf('ok') >= 0, ids: ids, auto: s.indexOf('auto_fail') >= 0, raw: s };\n  }\n  missingLabel(p) {\n    if (!p.ng) return '—';\n    // ไม่มีเลขติดมา = เฟิร์มแวร์รุ่นเก่า หรือตอนนั้นกล้องอ่านค่าไม่ได้เลย\n    if (!p.ids.length) return 'ไม่ระบุ';\n    return p.ids.map((i) => 'สี ID ' + i).join(' + ');\n  }\n  // แยกให้เห็นว่า NG มาจากการตรวจตอนกดปุ่ม หรือจากตัวจับเวลา 5 วินาที\n  causeLabel(p) {\n    if (!p.ng) return 'ผ่าน';\n    return p.auto ? 'ครบ 5 วินาทีไม่พบสีครบ' : 'ตรวจแล้วสีไม่ครบ';\n  }\n\n  buckets() {\n    const order = [], b = {};\n    for (let i = 11; i >= 0; i--) { const k = new Date(Date.now() - i * 3600 * 1000).getHours() + ':00'; b[k] = { ok: 0, ng: 0 }; order.push(k); }\n    (this.state.events || []).forEach((r) => {\n      const k = new Date(r.created_at).getHours() + ':00';\n      if (!b[k]) return;\n      const p = this.parseEv(r.event);\n      if (p.ng) b[k].ng++; else if (p.ok) b[k].ok++;\n    });\n    return { order: order, b: b };\n  }\n\n  spark(arr, w, h) {\n    const a = arr.length > 1 ? arr : [0, 0];\n    const max = Math.max.apply(null, a), min = Math.min.apply(null, a), sp = max - min || 1;\ danger ? '#b91c1c' : '#15803d') : '#6c7286',\n        anim: x.on && x.danger ? 'dotPulse 1.2s ease-out infinite' : 'none' })),\n\n      hourly: bk.order.map((k) => ({\n        okH: ((bk.b[k].ok / maxBar) * 100).toFixed(1) + '%',\n        ngH: ((bk.b[k].ng / maxBar) * 100).toFixed(1) + '%',\n        short: k.replace(':00', ''),\n        title: k + ' · OK ' + bk.b[k].ok + ' / NG ' + bk.b[k].ng,\n      })),\n      hourlyRange: bk.order[0] + ' → ' + bk.order[bk.order.length - 1],\n      trendPoints: bk.order.map((k, i) => {\n        const t = bk.b[k].ok + bk.b[k].ng;\n        const y = t > 0 ? 186 - (bk.b[k].ok / t) * 164 : 186;\n        return ((i / (bk.order.length - 1)) * 600).toFixed(1) + ',' + y.toFixed(1);\n      }).join(' '),\n      trendFirst: bk.order[0], trendLast: bk.order[bk.order.length - 1],\n\n      feed: feed, feedEmpty: feed.length === 0, feedOk: okShift, feedNg: ngRows.length,\n      feedFlash: React.createElement('div', { key: st.flashKey,\n        style: { height: '100%', borderRadius: 999, background: 'linear-gradient(90deg,#4f6bf6,#8b5cf6)', transformOrigin: 'left', animation: 'flash 1.1s ease both' } }),\n\n      q: st.q, onQ: (e) => this.setState({ q: e.target.value, page: 0 }),\n      filters: filterDefs.map(([v, label]) => ({ label: label, go: () => this.setState({ filter: v, page: 0 }),\n        bg: st.filter === v ? '#eef1ff' : '#fff', fg: st.filter === v ? BLUE : '#4a4f68',\n        border: st.filter === v ? BLUE : '#e4e7f2' })),\n      histRows: hist.slice(page * perPage, page * perPage + perPage),\n      histEmpty: hist.length === 0, histCount: hist.length.toLocaleString(),\n      pageNo: page + 1, pageTotal: pageTotal,\n      prevPage: () => this.setState({ page: Math.max(0, page - 1) }),\n      nextPage: () => this.setState({ page: Math.min(pageTotal - 1, page + 1) }),\n      exportCsv: () => this.exportCsv(), reload: () => { this.loadStatus(); this.loadEvents(); },\n\n      lotTiles: [\n        { label: 'เป้าหมายล็อต', icon: '◎', iconBg ,\n        onOk: () => this.rpcCmd('reset_totals', {}, 'ล้างยอดรวมสะสม'),\n      }),\n      factoryReset: () => this.askConfirm({\n        title: 'คืนค่าทั้งหมดกลับค่าเริ่มต้น?',\n        lines: ['ยอดรวม OK / NG = 0',\n                'Counting = 0 และ Setting = 10',\n                'ปลดสถานะ NG / LOCK ทั้งหมด',\n                'ล้างประวัติผลการเทสทิ้งทั้งหมด'],\n        okLabel: 'คืนค่าทั้งหมด',\n        onOk: () => this.rpcCmd('factory_reset', { p_clear_log: true }, 'คืนค่าทั้งหมด'),\n      }),\n      confirmOn: st.confirmOn,\n      confirmTitle: st.confirmTitle,\n      confirmLines: st.confirmLines,\n      confirmOkLabel: st.confirmOkLabel,\n      confirmAccept: () => this.acceptConfirm(),\n      confirmCancel: () => this.closeConfirm(),\n      cmdMsg: st.cmdMsg,\n      sound: st.sound, toggleSound: () => this.setState({ sound: !st.sound }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
